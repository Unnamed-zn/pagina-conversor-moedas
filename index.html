<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Moedas</title>
    <link rel="stylesheet" href="output.css">
</head>

<body>
    <h1 class="page-title">Conversor de Moeda</h1>

    <div class="converter">
        <div class="coins">
            <h2 class="coin-title">Moeda 1</h2>
            <div class="fields">
                <input class="value" id="value1" type="text">
                <select name="moeda" class="moeda" id="1">
                    <option value="real">Real</option>
                    <option value="dolar">Dólar</option>
                    <option value="euro">Euro</option>
                    <option value="libra">Libra</option>
                </select>
            </div>
        </div>
        <div class="coins">
            <h2 class="coin-title">Moeda 2</h2>
            <div class="fields">
                <input class="value" id ="value2" type="text">
                <select name="moeda" class="moeda" id="2">
                    <option value="real">Real</option>
                    <option value="dolar">Dólar</option>
                    <option value="euro">Euro</option>
                    <option value="libra">Libra</option>
                </select>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
