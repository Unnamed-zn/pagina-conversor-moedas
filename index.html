<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Moedas</title>
    <link rel="stylesheet" href="output.css">
</head>

<body>
    <h1 class="page-title">Conversor de Moeda</h1>

    <div class="converter">
        <div class="coins">
            <h2 class="coin-title">Moeda 1</h2>
            <div class="fields">
                <input class="value" type="text">
                <select name="moeda" class="moeda" id="moeda">
                    <option value="Real">Real</option>
                    <option value="Dolar">Dólar</option>
                    <option value="Euro">Euro</option>
                    <option value="Libra">Libra</option>
                </select>
            </div>
        </div>
        <div class="coins">
            <h2 class="coin-title">Moeda 2</h2>
            <div class="fields">
                <input class="value" type="text">
                <select name="moeda" class="moeda" id="moeda">
                    <option value="Real">Real</option>
                    <option value="Dolar">Dólar</option>
                    <option value="Euro">Euro</option>
                    <option value="Libra">Libra</option>
                </select>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
